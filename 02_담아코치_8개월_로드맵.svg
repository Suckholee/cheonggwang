<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" font-family="'NanumGothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#818CF8"/></linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#34D399"/></linearGradient>
    <linearGradient id="bar5" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#FBBF24"/></linearGradient>
  </defs>

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" font-size="30" font-weight="800" fill="#0F172A">담아코치 — 8개월 추진 로드맵</text>
  <text x="700" y="80" text-anchor="middle" font-size="16" fill="#64748B">2026.05 ~ 2026.12 · 모두의창업 프로그램 협약기간 · '검증 → 영업 자산화 → 초기 고객 확보' 5단계</text>

  <!-- Current state baseline -->
  <rect x="60" y="110" width="1280" height="60" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="80" y="135" font-size="13" font-weight="700" fill="#0F172A">시작점 (2026.05)</text>
  <text x="80" y="158" font-size="12" fill="#475569">● MVP 완성  ● 특허 가출원(10-2026-0012213)  ● 파일럿 2곳 (중랑구·청량리) 4주째 주 3회 운영  ● 팀 구성 (CEO + CPO + AI 리서처)</text>

  <!-- Month header -->
  <g font-size="14" font-weight="700" fill="#0F172A">
    <text x="220" y="210" text-anchor="middle">5월</text>
    <text x="360" y="210" text-anchor="middle">6월</text>
    <text x="500" y="210" text-anchor="middle">7월</text>
    <text x="640" y="210" text-anchor="middle">8월</text>
    <text x="780" y="210" text-anchor="middle">9월</text>
    <text x="920" y="210" text-anchor="middle">10월</text>
    <text x="1060" y="210" text-anchor="middle">11월</text>
    <text x="1200" y="210" text-anchor="middle">12월</text>
  </g>

  <!-- Month grid lines -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="150" y1="225" x2="150" y2="600"/>
    <line x1="290" y1="225" x2="290" y2="600"/>
    <line x1="430" y1="225" x2="430" y2="600"/>
    <line x1="570" y1="225" x2="570" y2="600"/>
    <line x1="710" y1="225" x2="710" y2="600"/>
    <line x1="850" y1="225" x2="850" y2="600"/>
    <line x1="990" y1="225" x2="990" y2="600"/>
    <line x1="1130" y1="225" x2="1130" y2="600"/>
    <line x1="1270" y1="225" x2="1270" y2="600"/>
  </g>

  <!-- Y axis label column -->
  <rect x="60" y="225" width="90" height="375" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Stage 1 -->
  <rect x="150" y="240" width="280" height="56" rx="8" fill="url(#bar1)"/>
  <text x="70" y="275" font-size="13" font-weight="700" fill="#5B21B6">①</text>
  <text x="160" y="265" font-size="14" font-weight="700" fill="white">파일럿 데이터 '도입 전후 비교 리포트' 패키징</text>
  <text x="160" y="285" font-size="12" fill="#EDE9FE">→ 영업 자산화 (기록 정리 시간·피드백 리드타임·재원 유지율)</text>

  <!-- Stage 2 -->
  <rect x="290" y="312" width="420" height="56" rx="8" fill="url(#bar2)"/>
  <text x="70" y="347" font-size="13" font-weight="700" fill="#3730A3">②</text>
  <text x="300" y="337" font-size="14" font-weight="700" fill="white">시니어 원장용 쉬운 UI 재정비</text>
  <text x="300" y="357" font-size="12" fill="#E0E7FF">→ 디자인 시스템 단위 정비 · Vibe UI 조작 부담 최소화</text>

  <!-- Stage 3 -->
  <rect x="570" y="384" width="280" height="56" rx="8" fill="url(#bar3)"/>
  <text x="70" y="419" font-size="13" font-weight="700" fill="#1E40AF">③</text>
  <text x="580" y="409" font-size="14" font-weight="700" fill="white">협력 학원 파일럿 확장 + 정량 검증</text>
  <text x="580" y="429" font-size="12" fill="#DBEAFE">→ 기록 정리 시간 절감 / 피드백 리드타임 / 재원 유지율</text>

  <!-- Stage 4 -->
  <rect x="850" y="456" width="280" height="56" rx="8" fill="url(#bar4)"/>
  <text x="70" y="491" font-size="13" font-weight="700" fill="#065F46">④</text>
  <text x="860" y="481" font-size="14" font-weight="700" fill="white">유료 전환 구조 안착</text>
  <text x="860" y="501" font-size="12" fill="#D1FAE5">→ 학생당 월 2만원 · 학원 월 30만원 · 온보딩 표준화</text>

  <!-- Stage 5 -->
  <rect x="990" y="528" width="280" height="56" rx="8" fill="url(#bar5)"/>
  <text x="70" y="563" font-size="13" font-weight="700" fill="#92400E">⑤</text>
  <text x="1000" y="553" font-size="14" font-weight="700" fill="white">도입 학원 10곳 + 직영점 1호 오픈</text>
  <text x="1000" y="573" font-size="12" fill="#FEF3C7">→ 인근 상권 직접영업 · B2B2C 플라이휠 시작</text>

  <!-- KPI box at end — 박스 키우고 2줄로 구성 -->
  <rect x="60" y="620" width="1280" height="130" rx="10" fill="#0F172A"/>
  <text x="80" y="652" font-size="15" font-weight="800" fill="#FFFFFF">협약 종료 시점 (2026.12) KPI</text>

  <!-- Row 1: KPI cards -->
  <g font-size="13" font-weight="600">
    <text x="80" y="690" font-size="14" fill="#60A5FA">●</text>
    <text x="100" y="690" fill="#CBD5E1">도입 학원</text>
    <text x="190" y="690" font-size="16" font-weight="800" fill="#FBBF24">10곳</text>

    <text x="360" y="690" font-size="14" fill="#34D399">■</text>
    <text x="380" y="690" fill="#CBD5E1">직영 학습관</text>
    <text x="490" y="690" font-size="16" font-weight="800" fill="#FBBF24">1호점</text>

    <text x="640" y="690" font-size="14" fill="#FBBF24">₩</text>
    <text x="660" y="690" fill="#CBD5E1">월 매출</text>
    <text x="740" y="690" font-size="16" font-weight="800" fill="#FBBF24">300만원 + 직영 수강료</text>

    <text x="1020" y="690" font-size="14" fill="#22D3EE">↗</text>
    <text x="1040" y="690" fill="#CBD5E1">누적 매출</text>
    <text x="1130" y="690" font-size="16" font-weight="800" fill="#FBBF24">1.26억원 (1차년도)</text>
  </g>

  <!-- Row 2: BEP -->
  <text x="80" y="725" font-size="14" fill="#F87171">▶</text>
  <text x="100" y="725" font-size="13" fill="#CBD5E1">2차년도 초 BEP 진입 준비:</text>
  <text x="300" y="725" font-size="13" font-weight="700" fill="#FBBF24">월 1,300만 원 / 도입 44곳</text>
  <text x="560" y="725" font-size="13" fill="#94A3B8">·  3차년도 매출 18.4억 원 규모 확장 계획</text>

  <!-- Source annotation outside box -->
  <text x="700" y="780" text-anchor="middle" font-size="11" fill="#64748B" font-style="italic">출처: 담아코치 2026년 사업계획서 · 사업 추진 일정(협약기간 내) + 자금 운용 계획</text>
</svg>
