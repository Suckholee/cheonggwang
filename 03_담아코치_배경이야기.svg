<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" font-family="'NanumGothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <linearGradient id="c1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#E2E8F0"/></linearGradient>
    <linearGradient id="c2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FEF3C7"/><stop offset="100%" stop-color="#FDE68A"/></linearGradient>
    <linearGradient id="c3" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#DBEAFE"/><stop offset="100%" stop-color="#BFDBFE"/></linearGradient>
    <linearGradient id="c4" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#EDE9FE"/><stop offset="100%" stop-color="#DDD6FE"/></linearGradient>
    <linearGradient id="c5" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#DCFCE7"/><stop offset="100%" stop-color="#BBF7D0"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" font-size="30" font-weight="800" fill="#0F172A">담아코치 — 배경 이야기</text>
  <text x="700" y="80" text-anchor="middle" font-size="16" fill="#64748B">1년의 현장 관찰부터 사업화 결심까지, 5단계의 발견 여정</text>

  <!-- Story flow stage labels -->
  <g font-size="13" font-weight="700" fill="#64748B">
    <text x="200" y="135" text-anchor="middle">STAGE 1</text>
    <text x="460" y="135" text-anchor="middle">STAGE 2</text>
    <text x="720" y="135" text-anchor="middle">STAGE 3</text>
    <text x="980" y="135" text-anchor="middle">STAGE 4</text>
    <text x="1240" y="135" text-anchor="middle">STAGE 5</text>
  </g>
  <g font-size="15" font-weight="800" fill="#0F172A">
    <text x="200" y="158" text-anchor="middle">관찰</text>
    <text x="460" y="158" text-anchor="middle">정량 손실</text>
    <text x="720" y="158" text-anchor="middle">시장 검증</text>
    <text x="980" y="158" text-anchor="middle">직접 구축</text>
    <text x="1240" y="158" text-anchor="middle">결심</text>
  </g>

  <!-- Connecting line between stage labels and cards -->
  <line x1="290" y1="180" x2="370" y2="180" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="550" y1="180" x2="630" y2="180" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="810" y1="180" x2="890" y2="180" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1070" y1="180" x2="1150" y2="180" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ① Card: 1년 학원 현장 관찰 -->
  <rect x="70" y="200" width="260" height="400" rx="14" fill="url(#c1)" stroke="#64748B" stroke-width="2"/>
  <circle cx="110" cy="240" r="22" fill="#475569"/>
  <text x="110" y="247" text-anchor="middle" font-size="22" fill="white" font-weight="700">①</text>
  <text x="145" y="247" font-size="15" font-weight="800" fill="#0F172A">1년 현장 관찰</text>

  <text x="90" y="290" font-size="14" font-weight="700" fill="#0F172A">발견한 한 가지 모순</text>
  <text x="90" y="318" font-size="13" fill="#334155">학원이 학부모에게 파는</text>
  <text x="90" y="336" font-size="13" fill="#334155">가장 큰 가치는 '관리'.</text>
  <text x="90" y="364" font-size="13" font-weight="700" fill="#B91C1C">하지만 그 '관리'의</text>
  <text x="90" y="382" font-size="13" font-weight="700" fill="#B91C1C">핵심 데이터는</text>
  <text x="90" y="400" font-size="13" font-weight="700" fill="#B91C1C">원장의 기억과</text>
  <text x="90" y="418" font-size="13" font-weight="700" fill="#B91C1C">분산된 손글씨로</text>
  <text x="90" y="436" font-size="13" font-weight="700" fill="#B91C1C">흩어져 있다.</text>

  <rect x="90" y="465" width="220" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="105" y="488" font-size="12" font-weight="700" fill="#475569">현장 일과</text>
  <text x="105" y="510" font-size="11" fill="#475569">● 평일 — 학생 수업</text>
  <text x="105" y="528" font-size="11" fill="#475569">● 저녁 — 학부모 상담</text>
  <text x="105" y="546" font-size="11" fill="#475569">● 밤 — 코칭 노트</text>
  <text x="105" y="564" font-size="11" fill="#475569">     손글씨 정리 반복</text>

  <!-- ② Card: 주 6~8시간 손실 -->
  <rect x="330" y="200" width="260" height="400" rx="14" fill="url(#c2)" stroke="#D97706" stroke-width="2"/>
  <circle cx="370" cy="240" r="22" fill="#B45309"/>
  <text x="370" y="247" text-anchor="middle" font-size="22" fill="white" font-weight="700">②</text>
  <text x="405" y="247" font-size="15" font-weight="800" fill="#78350F">정량 손실 발견</text>

  <text x="350" y="290" font-size="14" font-weight="700" fill="#78350F">직접 해보니…</text>
  <text x="350" y="318" font-size="13" fill="#78350F">학생 한 명당 한 주 정리에</text>

  <text x="460" y="370" text-anchor="middle" font-size="42" font-weight="800" fill="#B45309">6~8h</text>
  <text x="460" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#78350F">주당 손실</text>

  <text x="460" y="445" text-anchor="middle" font-size="13" fill="#78350F">시급 2.5만원 기준</text>
  <text x="460" y="468" text-anchor="middle" font-size="20" font-weight="800" fill="#B45309">월 60~80만원</text>
  <text x="460" y="488" text-anchor="middle" font-size="12" fill="#78350F">기회비용 발생</text>

  <rect x="350" y="510" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
  <text x="365" y="530" font-size="11" font-weight="700" fill="#78350F">증상</text>
  <text x="365" y="548" font-size="11" fill="#78350F">● 학생↑ 시간↑ 비례 증가</text>
  <text x="365" y="566" font-size="11" fill="#78350F">● 강사 추가 시 피드백 분산</text>

  <!-- ③ Card: 시장 트렌드 검증 -->
  <rect x="590" y="200" width="260" height="400" rx="14" fill="url(#c3)" stroke="#2563EB" stroke-width="2"/>
  <circle cx="630" cy="240" r="22" fill="#1D4ED8"/>
  <text x="630" y="247" text-anchor="middle" font-size="22" fill="white" font-weight="700">③</text>
  <text x="665" y="247" font-size="15" font-weight="800" fill="#1E3A8A">시장 검증</text>

  <text x="610" y="290" font-size="14" font-weight="700" fill="#1E3A8A">혼자의 발견이 아니다</text>
  <text x="610" y="312" font-size="12" fill="#1E40AF">시장 전체가 같은 방향으로 이동</text>

  <text x="720" y="360" text-anchor="middle" font-size="34" font-weight="800" fill="#1D4ED8">28.5조원</text>
  <text x="720" y="385" text-anchor="middle" font-size="12" fill="#1E40AF">2025 국내 초중고 사교육비</text>
  <text x="720" y="402" text-anchor="middle" font-size="10" fill="#64748B" font-style="italic">출처: 통계청 (2026.03)</text>

  <rect x="610" y="425" width="220" height="150" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
  <text x="625" y="448" font-size="12" font-weight="700" fill="#1E3A8A">시장 무게중심 이동</text>
  <text x="625" y="470" font-size="11" fill="#1E40AF">● 강의 → 학습관리·진로</text>
  <text x="625" y="488" font-size="11" fill="#1E40AF">    설계형 서비스 중심</text>
  <text x="625" y="510" font-size="11" fill="#1E40AF">● 고교학점제로 학부모는</text>
  <text x="625" y="528" font-size="11" fill="#1E40AF">    '더 정밀한 관리' 요구</text>
  <text x="625" y="550" font-size="11" font-weight="700" fill="#B91C1C">● 1인 원장은 손글씨로</text>
  <text x="625" y="568" font-size="11" font-weight="700" fill="#B91C1C">    그 무게를 혼자 진다</text>

  <!-- ④ Card: 직접 구축 -->
  <rect x="850" y="200" width="260" height="400" rx="14" fill="url(#c4)" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="890" cy="240" r="22" fill="#6D28D9"/>
  <text x="890" y="247" text-anchor="middle" font-size="22" fill="white" font-weight="700">④</text>
  <text x="925" y="247" font-size="15" font-weight="800" fill="#4C1D95">직접 구축</text>

  <text x="870" y="290" font-size="14" font-weight="700" fill="#4C1D95">그래서 직접 만들었다</text>
  <text x="870" y="312" font-size="12" fill="#5B21B6">팀 · 특허 · MVP · 파일럿</text>

  <text x="870" y="345" font-size="12" font-weight="700" fill="#5B21B6">팀 구성</text>
  <text x="870" y="365" font-size="11" fill="#4C1D95">● CEO — AI/LMS 개발 경험</text>
  <text x="870" y="383" font-size="11" fill="#4C1D95">● CPO — 학원 운영 20년</text>
  <text x="870" y="401" font-size="11" fill="#4C1D95">● 연구원 — AI 석박 4년차</text>
  <text x="870" y="419" font-size="11" fill="#4C1D95">    (XAI 연구)</text>

  <text x="870" y="447" font-size="12" font-weight="700" fill="#5B21B6">기술 자산</text>
  <text x="870" y="467" font-size="11" fill="#4C1D95">● 특허 가출원</text>
  <text x="870" y="485" font-size="11" fill="#4C1D95">    10-2026-0012213</text>
  <text x="870" y="503" font-size="11" fill="#4C1D95">● MVP 완성</text>

  <rect x="870" y="520" width="220" height="55" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="980" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#5B21B6">파일럿 운영 중</text>
  <text x="980" y="558" text-anchor="middle" font-size="11" fill="#4C1D95">중랑구·청량리 학원 2곳</text>
  <text x="980" y="571" text-anchor="middle" font-size="11" fill="#4C1D95">4주째 · 주 3회 실제 사용</text>

  <!-- ⑤ Card: 결심 -->
  <rect x="1110" y="200" width="260" height="400" rx="14" fill="url(#c5)" stroke="#16A34A" stroke-width="2"/>
  <circle cx="1150" cy="240" r="22" fill="#15803D"/>
  <text x="1150" y="247" text-anchor="middle" font-size="22" fill="white" font-weight="700">⑤</text>
  <text x="1185" y="247" font-size="15" font-weight="800" fill="#14532D">결심 트리거</text>

  <text x="1130" y="290" font-size="14" font-weight="700" fill="#14532D">사업화로 옮긴 한 마디</text>

  <rect x="1130" y="310" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
  <text x="1240" y="345" text-anchor="middle" font-size="14" font-weight="800" fill="#14532D">"이 도구 없으면</text>
  <text x="1240" y="370" text-anchor="middle" font-size="14" font-weight="800" fill="#14532D">다시 못 돌아갑니다."</text>
  <text x="1240" y="397" text-anchor="middle" font-size="11" fill="#166534">— 파일럿 학원 원장님</text>

  <text x="1130" y="445" font-size="12" font-weight="700" fill="#14532D">파일럿 1차 검증</text>
  <text x="1130" y="467" font-size="11" fill="#14532D">● 기록 정리 시간</text>
  <text x="1130" y="485" font-size="11" font-weight="700" fill="#15803D">    주당 1~2h 감소</text>
  <text x="1130" y="507" font-size="11" fill="#14532D">● 학원 1곳 — 즉시 유료</text>
  <text x="1130" y="525" font-size="11" font-weight="700" fill="#15803D">    전환 가능 회신</text>
  <text x="1130" y="547" font-size="11" fill="#14532D">● 학원 1곳 — 추가 검토 중</text>

  <rect x="1130" y="555" width="220" height="22" rx="4" fill="#15803D"/>
  <text x="1240" y="571" text-anchor="middle" font-size="12" fill="white" font-weight="800">→ 정식 사업화 결정</text>

  <!-- Bottom: 핵심 메시지 ribbon -->
  <rect x="60" y="635" width="1280" height="120" rx="12" fill="#0F172A"/>
  <text x="80" y="667" font-size="14" fill="#FBBF24" font-weight="700">담아코치의 출발점</text>
  <text x="80" y="700" font-size="20" font-weight="800" fill="#FFFFFF">"관리형 학원이 '관리'를 잃지 않게, 1인 원장의 6~8시간을 되찾아주는 학습코칭 OS."</text>
  <line x1="80" y1="715" x2="1320" y2="715" stroke="#334155" stroke-width="1"/>
  <text x="80" y="740" font-size="13" fill="#CBD5E1">현장 1년 관찰 · 정량 손실 발견 · 시장 트렌드 검증 · 팀과 특허로 구축 · 파일럿 원장님의 한 마디</text>
  <text x="1320" y="740" text-anchor="end" font-size="13" fill="#94A3B8" font-style="italic">— 담아코치 2026</text>
</svg>
